name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (use \n for newlines)
        type: string
        required: false
      bump:
        description: 'Bump type'
        required: false
        default: 'next'
        type: choice
        options:
          - 'next'
          - 'major'
          - 'minor'
          - 'patch'
          - 'current'
      github_release:
        description: 'Create Github Release'
        default: true
        type: boolean
      docker_release:
        description: 'Push Docker images'
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_current: ${{ steps.versions.outputs.version_current }}
      version_next: ${{ steps.versions.outputs.version_next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install svu
        run: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt update
          sudo apt install svu
      - name: Compute next version for release
        run: |
          echo "VERSION_NEXT=$(svu ${{ inputs.bump }})" >> "$GITHUB_ENV"
      - name: Set Versions
        id: versions
        run: |
          echo "version_current=$(svu current)" >> "$GITHUB_OUTPUT"
          echo "version_next=${{ env.VERSION_NEXT }}" >> "$GITHUB_OUTPUT"

  webui_dist:
    name: Build web UI dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'next-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: next-ui/package-lock.json

      # next UI reads the commit from the working tree, so it builds before the web UI patch is applied
      - name: Build next UI
        working-directory: next-ui
        run: |
          npm ci
          npm run build

      - name: Upload next UI dist
        uses: actions/upload-artifact@v7
        with:
          name: nextui-dist
          path: next-ui/dist/**
          if-no-files-found: error

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'komga-webui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: komga-webui/package-lock.json

      - name: Patch web UI build config
        run: |
          set -euo pipefail
          git apply --verbose patches/komga-webui-disable-fork-ts-checker.patch

      - name: Build web UI
        working-directory: komga-webui
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npm ci
          npm run build

      - name: Upload web UI dist
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: komga-webui/dist/**
          if-no-files-found: error

  binary_release:
    name: Release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs:
      - version
      - webui_dist
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl builds run in rust:alpine so the C dependencies compile against musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            docker_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker_arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      PACKAGE: komga-rust-${{ needs.version.outputs.version_next }}-${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download web UI dist
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: komga-webui/dist

      - name: Download next UI dist
        uses: actions/download-artifact@v8
        with:
          name: nextui-dist
          path: next-ui/dist

      - name: Verify build inputs
        run: |
          set -euo pipefail
          test -f komga-webui/dist/index.html
          test -f next-ui/dist/index.html

      # Prebuilt; the Linux release is a static musl binary, so it also runs inside rust:alpine
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Build and package in rust:alpine
        if: matrix.docker_arch
        run: |
          docker run --rm -v "$PWD:/src" -v "$(command -v cargo-about):/usr/local/bin/cargo-about:ro" \
            -w /src/komga-rust rust:alpine sh -euc '
            apk add --no-cache bash git musl-dev cmake make perl g++ linux-headers
            git config --global --add safe.directory /src
            ./tools/release/package.sh "$0" "$1"
          ' "${{ matrix.target }}" "$VERSION"

      # aws-lc-sys assembles its Windows x86_64 sources with NASM
      - name: Setup NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        if: ${{ !matrix.docker_arch }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build and package
        if: ${{ !matrix.docker_arch }}
        run: ./komga-rust/tools/release/package.sh "${{ matrix.target }}" "$VERSION"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.target }}
          path: komga-rust/dist/${{ env.PACKAGE }}.*
          if-no-files-found: error

      - name: Upload Docker runtime artifact
        if: matrix.docker_arch
        uses: actions/upload-artifact@v7
        with:
          name: docker-artifacts-${{ matrix.docker_arch }}
          path: komga-rust/dist/${{ env.PACKAGE }}/komga-rust
          if-no-files-found: error

  github_release:
    name: Publish GitHub release
    if: inputs.github_release
    runs-on: ubuntu-latest
    needs:
      - version
      - binary_release
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      VERSION_CURRENT: ${{ needs.version.outputs.version_current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.VERSION_CURRENT }}
          head-ref: ${{ github.sha }}

      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          mkdir -p release_notes
          printf '%b\n' "$RELEASE_NOTES" > release_notes/release_notes.md
          if [[ -n "$CHANGELOG" ]]; then
            printf '\n%s\n' "$CHANGELOG" >> release_notes/release_notes.md
          fi
          echo "Release notes:"
          cat release_notes/release_notes.md
          echo ""

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t release_artifacts < <(find dist -maxdepth 1 -type f -name 'komga-rust-*' | sort)
          if [[ ${#release_artifacts[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes-file release_notes/release_notes.md
            gh release upload "${VERSION}" "${release_artifacts[@]}" --clobber
          else
            gh release create "${VERSION}" "${release_artifacts[@]}" --target "${GITHUB_SHA}" --title "${VERSION}" --notes-file release_notes/release_notes.md
          fi

  docker_release:
    name: Release Docker image
    if: inputs.docker_release
    runs-on: ubuntu-latest
    needs:
      - version
      - binary_release
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Display versions
        run: |
          echo "Current version: ${{ needs.version.outputs.version_current }}"
          echo "Release version: ${VERSION}"

      - name: Download amd64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-amd64
          path: docker-artifacts/linux-musl/amd64

      - name: Download arm64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-arm64
          path: docker-artifacts/linux-musl/arm64

      - name: Verify Docker runtime artifacts
        run: |
          set -euo pipefail
          test -f docker-artifacts/linux-musl/amd64/komga-rust
          test -f docker-artifacts/linux-musl/arm64/komga-rust

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./komga-rust/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
