[workspace]
resolver = "2"
members = [
    "crates/komga-types",
    "crates/komga-archive",
    "crates/komga-image",
    "crates/komga-search",
    "crates/komga-oauth",
    "crates/komga-db",
    "crates/komga-scheduler",
    "crates/komga-service",
    "crates/komga-api",
    "crates/komga-rust",
    "crates/komga-test-support",
    "tools/code-budget",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace crates
komga-types = { path = "crates/komga-types" }
komga-archive = { path = "crates/komga-archive" }
komga-image = { path = "crates/komga-image" }
komga-search = { path = "crates/komga-search" }
komga-oauth = { path = "crates/komga-oauth" }
komga-db = { path = "crates/komga-db" }
komga-scheduler = { path = "crates/komga-scheduler" }
komga-service = { path = "crates/komga-service" }
komga-api = { path = "crates/komga-api" }
komga-test-support = { path = "crates/komga-test-support" }

# Common async runtime and CLI
tokio = { version = "1.54", features = ["full", "io-uring"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1" }
webpki-root-certs = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }
tempfile = { version = "3.17" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
bcrypt = { version = "0.19" }
axum = { version = "0.8" }
tower = { version = "0.5" }
# Pinned to the version SQLx links, for registering SQL functions on its connections.
libsqlite3-sys = { version = "0.40", default-features = false }
sea-query = { version = "1.0", features = ["derive"] }
sea-query-sqlx = { version = "0.9", features = ["sqlx-sqlite"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["io"] }
socket2 = "0.6"
quick_cache = { version = "0.7" }
base64 = { version = "0.23" }
getrandom = { version = "0.4" }
hex = { version = "0.4" }
sha2 = { version = "0.11" }
md-5 = { version = "0.11" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
cookie = { version = "0.18" }
client-ip = { version = "0.2" }
idna = { version = "1.1", default-features = false, features = ["alloc"] }
form_urlencoded = "1.2"
httpdate = "1.0"
url = "2.5"
icu_casemap = "2.4"
icu_collator = "2.4"
icu_locale_core = "2.4"
icu_normalizer = "2.4"
icu_properties = "2.4"
jiff = { version = "1", features = ["serde"] }
language-tags = "0.3"
rust-embed = "8.14"
rustfs-mimalloc = { version = "0.7", features = ["no_profile"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
rxing = { version = "0.9", default-features = false, features = ["oned", "decoders", "no_character_set_support"] }
jsonwebtoken = { version = "12.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = { version = "1.19" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
jsonschema = { version = "0.63", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
java-properties = "2.0"
procfs = { version = "0.18", default-features = false }
rustix = { version = "1.1", features = ["fs"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
syn = { version = "3.0", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
quick-xml = "0.42"
html5ever = "0.40"
html5gum = "0.9"
fancy-regex = "0.20"
flate2 = "1.1"
deflate64 = "0.1"
bzip2 = "0.6"
crc32fast = "1.5"
# Pure-Rust RAR 1.5-7 reader: keeps stored member names as junrar does (libunrar rewrites `\`)
# and bounds decoding. Reading only, so no writer, recovery, encryption or rayon.
rars = { version = "0.13.1", default-features = false }
# Pixel decoding and encoding; formats limited to Komga's ImageIO readers that decode in pure Rust.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tiff", "webp"] }
# Pure-Rust JPEG XL decoder behind `image::ImageDecoder`; without rayon it decodes on the caller's
# bounded pool thread. Chosen over `oxideav-jpegxl` 0.0.15, which on 36 MP VarDCT pages was 4.6-36x
# slower and drew wrong 8x8 blocks; switch once it matches in speed and output.
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
# Pure-Rust HEVC-coded HEIF/HEIC decoder. Chosen over `oxideav-heif` 0.0.15, which decoded 36 MP
# pages about 2.2x slower and with jagged colour edges (max diff ~100 vs macOS, heifer 3); switch
# once it catches up, and let it decode AVIF too in place of `oxideav-avif`.
heifer = { version = "0.5", default-features = false }
# Pure-Rust AVIF decoder: `image`'s AVIF decoder refuses grid images.
oxideav-avif = "0.0.18"
# Pure-Rust JPEG 2000 (JP2 and bare codestream) and JBIG2 decoders behind `image::ImageDecoder`.
# Chosen over `oxideav-jpeg2000`, which decodes a 36 MP page 9-13x slower.
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd", "image"] }
hayro-jbig2 = { version = "0.4", default-features = false, features = ["std", "simd", "image"] }
# Pure-Rust PCX and WBMP decoders; without the default `registry` feature they skip oxideav-core.
oxideav-pcx = { version = "0.1", default-features = false }
oxideav-wbmp = { version = "0.0.5", default-features = false }
# Header-only size probing; formats limited to those Komga's ImageIO readers decode.
# Patched in `komga-image::dimension`: 0.15.0 reads the BMP height as unsigned, so
# top-down bitmaps overflow. On upgrade, check whether that workaround can be removed.
imagesize = { version = "0.15", default-features = false, features = ["bmp", "gif", "heif", "jpeg", "jxl", "png", "pnm", "tiff", "webp"] }
# Pure-Rust PDF parser and renderer with embedded standard fonts and CMaps; 0.x, so pinned and
# re-checked against the PDF fixtures on upgrade.
hayro = { version = "=0.9.0" }
hayro-write = { version = "=0.9.0" }
# Full-text index replacing Lucene; no stemmers or stop words, as the baseline analyzers use none.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
# Tantivy's own automaton trait and regex DFA, for term automata over one field of a shared
# index field; must stay the version tantivy uses.
tantivy-fst = "0.5"
# Escapes literal text inside the regular expressions built for wildcard and prefix queries.
regex-syntax = "0.8"
# Pure UAX #29 word boundaries, as Lucene's StandardTokenizer uses (ICU's segmenter adds dictionaries).
unicode-segmentation = "1.13"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

# Emit only DWARF line tables in dev/test builds: preserves full file:line backtraces while
# avoiding hundreds of megabytes of .debug_info/.debug_loc/.debug_str in rlibs and test binaries.
[profile.dev]
debug = "line-tables-only"

# Full DWARF debuginfo for interactive gdb/lldb sessions (`--profile dbg` / `--cargo-profile dbg`).
[profile.dbg]
inherits = "dev"
debug = "full"

# Bcrypt's cost-10 key expansion runs here; keep real hashing fast in debug servers and HTTP tests.
[profile.dev.package.blowfish]
opt-level = 3

# Media type detection evaluates hundreds of registry patterns per file; unoptimized, a
# detection takes milliseconds in tests.
[profile.test.package.komga-archive]
opt-level = 3

# Page rendering and thumbnails operate on up to 15 MP images in integration tests.
[profile.test.package.komga-image]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# Deflate behind flate2; unoptimized, inflating a 256 MiB page takes seconds.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

# Pixel decoding, encoding, and compositing
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.fax]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.dev.package.pxfm]
opt-level = 3

# JPEG XL decoding; unoptimized, a 1 MP VarDCT page takes 1 s and a 36 MP page 13 s.
[profile.dev.package.jxl-oxide]
opt-level = 3

[profile.dev.package.jxl-bitstream]
opt-level = 3

[profile.dev.package.jxl-coding]
opt-level = 3

[profile.dev.package.jxl-color]
opt-level = 3

[profile.dev.package.jxl-grid]
opt-level = 3

[profile.dev.package.jxl-modular]
opt-level = 3

[profile.dev.package.jxl-render]
opt-level = 3

[profile.dev.package.jxl-vardct]
opt-level = 3

# Unoptimized, a 36 MP HEIC page takes 15 s and an AVIF page 30 s.
[profile.dev.package.heifer]
opt-level = 3

[profile.dev.package.heifer-hevc-dec]
opt-level = 3

[profile.dev.package.oxideav-av1]
opt-level = 3

[profile.dev.package.oxideav-avif]
opt-level = 3

[profile.dev.package.oxideav-heif]
opt-level = 3

# Unoptimized, a 36 MP page takes 27 s as JPEG 2000, 3 s as JBIG2.
[profile.dev.package.hayro-jpeg2000]
opt-level = 3

[profile.dev.package.hayro-jbig2]
opt-level = 3

[profile.dev.package.hayro-ccitt]
opt-level = 3

# PDF rasterization; unoptimized, a blank 3200x4525 page takes about a second.
[profile.dev.package.hayro]
opt-level = 3

[profile.dev.package.hayro-interpret]
opt-level = 3

[profile.dev.package.hayro-syntax]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

# EAN-13 barcode detection runs on up to 6 rendered 15 MP PDF pages per book during metadata refresh.
[profile.dev.package.rxing]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "allow"
unimplemented = "allow"
